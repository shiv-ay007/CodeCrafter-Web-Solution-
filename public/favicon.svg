<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ccBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004658" />
      <stop offset="50%" stop-color="#003543" />
      <stop offset="100%" stop-color="#00222b" />
    </linearGradient>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff" />
      <stop offset="50%" stop-color="#00a8cc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#ccBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#00d8ff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- CodeCrafter Wave / Swirl Dynamic Arc -->
  <path d="M 44 20 C 36 12, 18 16, 17 29 C 16 41, 30 48, 41 43 C 44 41, 46 38, 47 35" 
        stroke="url(#swirlGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner Concentric Arc -->
  <path d="M 39 26 C 33 21, 23 23, 23 31 C 23 38, 32 41, 38 37" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-opacity="0.9" />

  <!-- Orange Accent Spark / Pulse Dot -->
  <circle cx="47" cy="20" r="4.5" fill="#EA580C" filter="url(#glow)" />
  <circle cx="47" cy="20" r="2" fill="#FFE3D1" />
</svg>